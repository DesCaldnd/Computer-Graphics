org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=false
android.useAndroidX=true
android.nonTransitiveRClass=true
# Native build knobs (override on the command line: gradlew assembleDebug -PoxAbis=x86_64):
#   oxAbis            ABIs to build (arm64-v8a = phones, x86_64 = emulator)
#   oxNativeConfig    CMake configuration of the debug build type (Debug = -O0 for stepping, RelWithDebInfo = fast)
#   oxSanitizer       '', address (ASan + wrap.sh) or hwaddress (HWASan, arm64 Android 14+)
#   oxPak             cooked project (.oxpak) packaged as assets/project/ (tools/android/build.ps1 cooks it)
#   oxValidationDir   Khronos validation layer binaries (<dir>/<abi>/libVkLayer_khronos_validation.so), debug APKs
#   oxVcpkgInstalled  parent of the per-triplet vcpkg install roots (<dir>/x64-android, <dir>/arm64-android)
#   oxKeepSymbols     true = unstripped .so in debug APKs (~760 MB on x86_64); default: symbols stay in the build tree
#   oxJobs            parallel native compile jobs (CMake job pool ox_compile)
oxAbis=arm64-v8a,x86_64
oxNativeConfig=RelWithDebInfo
oxSanitizer=
oxPak=
oxValidationDir=E:/Development/Android/vvl
oxJobs=4
oxVcpkgInstalled=E:/Development/OxwaldEngine/vcpkg_installed_android
